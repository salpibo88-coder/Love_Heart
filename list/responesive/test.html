<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100%;
            height: 300px;
            display: grid;
            grid-template-columns: auto auto ;
            gap:10px;
        }
        .box{
            height: 150px;
            background: #4aff02;
        }
        @media (min-width:700px) {
            .container{
                grid-template-columns: auto auto auto;
                /* display: flex; */
                /* align-items: center;
                justify-content: center; */
            }
            .box{
                height: 250px;
            }
            
        }
        @media (min-width-1200px) {
            .container{
                grid-template-columns: auto auto  auto auto;
            }
            .box{
                height: 300px;
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
    
</body>
</html>
