<!-- <!DOCTYPE html> -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 400px;
            height: 500px;
            background-color: red;
            margin: 80px auto;
        }
        header,footer{
            width: 100%;
            height: 20%;
            background-color: rgb(0, 255, 0);
            /* text-align: center;
            align-content: center; */
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(0, 0, 0);
            font-size: 24px;
        }
        footer{
            background-color: black;
        }
        main{
            width: 100%;
            height: 60%;
            background-color: rgb(33, 100, 45);
            display: flex;
        }
        .left,.right{
            width: 50%;
            height: 100%;
            background-color: rgb(0, 255, 255);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: aliceblue;
        }
        .right{
            background-color: red;
        }
       
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h3>Header</h3>
        </header>
        <main>
            <div class="left">Left</div>
            <div class="right">Right</div>
        </main>
        <footer>
            <h3>Footer</h3>
        </footer>
    </div>
</body>
</html>
