    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        
    }
    body{
        background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSPQawHFE70GpXXnWKBsdu-GM6CZjEFTZ2PWA&s");
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        height:100vh;
        background-repeat: no-repeat;
        background-size: cover;
        backdrop-filter: blur(20px);
    }
    .Login{
        color:greenyellow;
        margin-bottom:0 px;
        
    }
    .input1{
        display:flex;
        flex-direction:column;
        gap:15px;
        margin-bottom:15px;
    }
    .input1 input{
        width:300px;
        padding:10px;
         border-radius: 10px;
        
    }
    .check{
        margin-bottom:17px;
        display: flex;
        text-align: right;
        
        
    }
    button{
        width:300px;
        padding:10px;
        cursor:pointer;
         border-radius: 10px;
        
    }
    hover-button{
        color: blue;
    }
    p{
        margin-top:15px;
    }
    </style>
    </head>
    <body>
    <div class="Login">
        <h1>Login</h1>
    </div>
    <div class="input1">
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
    </div>
    <div class="check">
        <input type="checkbox"> Remember me
    </div>
    <button>Login</button>
    <p>Don't have an account? <a href="">Rigester</a></p>
    </body>
    </html>
