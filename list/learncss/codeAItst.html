<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Exact Layout</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background: #dddddd;
    display: flex;
    justify-content: center;
    padding: 30px;
    font-family: Arial, sans-serif;
}
.container{
    width: 700px;
    background: #eeeeee;
    padding: 40px;
}
header{
    width: 100%;
    height: 90px;
    background: #c8d8ee;
    border: 2px solid #444;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;
    font-weight: bold;

    margin-bottom: 10px;
}
nav{
    width: 100%;
    height: 80px;
    background: #d7e8cb;
    border: 2px solid #444;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 36px;
    font-weight: bold;

    margin-bottom: 10px;
}

main{
    width: 100%;
    display: flex;
    gap: 10px;

    margin-bottom: 10px;
}
.box{
    flex: 1;
    height: 320px;
    background: #f4e3b4;
    border: 2px solid #444;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 32px;
    font-weight: bold;
    text-align: center;
}

footer{
    width: 100%;
    height: 90px;
    background: #c8d8ee;
    border: 2px solid #444;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="container">

    <header>
        Header
    </header>

    <nav>
        Navigation Menu
    </nav>

    <main>
        <div class="box">Content</div>

        <div class="box">
            Main<br>Content
        </div>

        <div class="box">Content</div>
    </main>

    <footer>
        Footer
    </footer>

</div>

</body>
</html>
