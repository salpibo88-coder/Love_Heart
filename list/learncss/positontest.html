<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contianer{
            width: 800px;
            height: 800px;
            background-color: aqua;
            margin:  20px auto;
            position: relative;
        }
         .box{
            width: 200px;
            height: 200px;
            background-color: rgb(204, 224, 173);
            position:absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color:red;
         }    
         .box1{
            width: 200px;
            height: 200px;
            background-color: rgb(153, 255, 0);
            position:absolute;
            right:50%;
            left:50%;
            transform: translate(-50%,-50%,-50%,-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            color:red;
            
         }  
         .box1{
            width: 200px;
            height: 200px;
            background-color: rgb(153, 255, 0);
            position:absolute;
            left:0%;
            right:50%;
            transform: translate(50%,25%,);
            display: flex;
            justify-content: center;
            align-items: center;
            color:red;
         }  
          .box2{
            width: 200px;
            height: 200px;
            background-color: rgb(153, 255, 0);
            position:absolute;
            top:0%;
            right:0%;
            transform: translate(50%,25%,);
            display: flex;
            justify-content: center;
            align-items: center;
            color:red;
         }  
          .box3{
            width: 200px;
            height: 200px;
            background-color: rgb(153, 255, 0);
            position:absolute;
            bottom:0%;
            left:0%;
            transform: translate(100%,25%,);
            display: flex;
            justify-content: center;
            align-items: center;
            color:red;
         } 
         .box4{
            width: 200px;
            height: 200px;
            background-color: rgb(153, 255, 0);
            position:absolute;
            bottom:0%;
            right:0%;
            transform: translate(100%,25%,);
            display: flex;
            justify-content: center;
            align-items: center;
            color:red;
         }                      
    </style>
</head>
<body>
    <div class="contianer">
        <div class="box">1</div>
        <div class="box1">2</div>
        <div class="box2">3</div>
        <div class="box3">4</div>
        <div class="box4">5</div>
    </div>
    
</body>
</html>
