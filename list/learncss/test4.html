<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Layout Design</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      border-radius: 10px;
      box-shadow: 2px 2px 3px 0;
    }
    .container{
      width:900px;
      height: 100px;
      background:#fcfcfc;
      display:grid;
      grid-template-columns:250px 1fr 1fr;
      grid-template-rows:90px 220px 180px 100px;
      gap:20px;
      margin: 20px auto;
    }
    .box{
      border-radius:8px;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:30px;
      font-weight:bold;
      box-shadow:0 4px 10px rgba(0,0,0,0.5);
    }
    header,footer{
      grid-column:1 / 4;
      background:#1c3667;
    }
    .sidebar{
      grid-row:2 / 4;
      background:#a56bff;
    }
    .content1{
      grid-column:2 / 4;
      background:#6a5cff;
    }
    .content2, .content3{
      background:#1fb6ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="box">
      Header
    </header>
    <div class="sidebar box">
      Sidebar
    </div>
    <div class="content1 box">
      Content-1
    </div>
    <div class="content2 box">
      Content-2
    </div>
    <div class="content3 box">
      Content-3
    </div>
    <footer class="box">
      Footer
    </footer>
  </div>
</body>
</html>
