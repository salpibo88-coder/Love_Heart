<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Document</title>

<style>

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    background: #ffffff;
    font-family: Arial, sans-serif;
    padding: 20px;
}
.container{
    width: 100%;
}
.box{
    border: 4px solid #434242;
    border-radius: 5px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    color: rgb(0, 0, 0);
    font-size: 32px;
    font-weight: bold;
}
header , footer{
    height: 90px;
    margin-bottom: 20px;

    background:rgb(255, 0, 217);
}
.main{
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

footer{
    background-color: rgb(0, 255, 140);
}

.sidebar{
    width: 26%;
    min-height: 450px;
    background:rgb(255, 0, 43);
}
.content{
    width: 74%;
    display: flex;
    flex-direction: column;
    gap: 20px;
}
.content1{
    height: 200px;
    background:rgb(153, 255, 0)
}
.bottom{
    display: flex;
    gap: 20px;
}
 .content2,.content3{
    flex: 1;
    height: 230px;
    background:rgb(212, 255, 0);
}
.content2{
    background-color: aqua;
}
</style>
</head>
<body>
<div class="container">
    <header class="box">
        header
    </header>
    <div class="main">
        <div class="sidebar box">
            sidebar
        </div>
        <div class="content">
            <div class="content1 box">
                Content-1
            </div>
            <div class="bottom">
                <div class="content2 box">
                    Content-2
                </div>
                <div class="content3 box">
                    Content-3
                </div>
            </div>
        </div>
    </div>
    <footer class="box">
        footer
    </footer>
</div>
</body>
</html>
