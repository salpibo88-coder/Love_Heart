<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: auto;
            padding: auto;
        }
        .container{
            width: 300px;
            height: 200px;
            background-color: rgb(255, 0, 191);
            position: relative;
            text-align: center;
       

        }
        .box{
            width: 100px;
            height: 100px;
            background-color: rgb(153, 255, 0);
            position:absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            align-items: center;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">Position
        <div class="box">Hello</div>
    </div>
    
</body>
</html>
