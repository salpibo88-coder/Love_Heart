<head>

    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            margin:  auto;
        }
        .container{
            width: 500px;
            height: 500px;
            background-color: rgb(0, 255, 255);
            margin: 10px auto;
            display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: rgb(0, 255, 0);
            margin: auto;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1{
            text-align: center;
            margin-top: 20px;
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
    <div class="main">
        <h1>Wirelles Over.ear Headphones</h1>
        <p> Orange Color Cute emotion to buy</p>

</html>
