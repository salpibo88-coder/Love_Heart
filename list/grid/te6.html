<!DOCTYPE html>
<html>
<head>
<style>
details {
    width: 300px;
    margin: 20px;
}

summary {
    cursor: pointer;
    font-weight: bold;
    color: blue;
    background-color: #b31616;
}

p {
    margin-top: 10px;
    background-color: #65f20e;
}
</style>
</head>
<body>

<details>
    <summary>Click here to show more</summary>
    <p>
        This is the hidden text. It appears when you click the summary.
    </p>
</details>

</body>
</html>
