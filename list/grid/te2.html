        * {

}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    padding: 20px;
}

.card {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card h3 {
    margin: 10px 0;
}

.card p {
    font-size: 20px;
    font-weight: bold;
}

.card button {
    margin-top: 10px;
    padding: 10px 20px;
    border: 1px solid #333;
    border-radius: 20px;
    background: white;
    cursor: pointer;
}
    </style>
