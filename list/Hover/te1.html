<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 300px;
            height: 300px;
            /* background-color: rgb(179, 179, 0); */
            margin: 20px auto;
        }
        .box{
            width:50px;
            height: 50px;
            background-color: rgb(0, 225, 255);
        }
        .box:hover{
            border-radius: 50%;
            transition: 0.4s;
           background-color: rgb(0, 255, 0);
           transform: rotate(270deg);
           /* transform:scale(1.2); */
           /* transform: skew(20deg); */
        }
    </style>
</head>
<body>
  <div class="container">
    <div class="box"></div>
  </div>
    
</body>
</html>
