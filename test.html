<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doument</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container{
            width: 600px;
            height: 600px;
            background-color: red;
            margin: 80px auto;
        }
         header,footer,.navigativeMenu{
            width: 100%;
            height: 10%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
        }
        header{
            background-color: green;
        }
        .navigativeMenu{
            background-color: blueviolet;
        }
        footer{
            background-color: blue;
            height: 30%;
        }
        main{
            width: 100%;
            height: 50%;
            display: flex;
        }
         .center,.left,.right{
            width: 40%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .left{
            background-color: cyan;
        }
        .center{
            background-color: rgb(0, 236, 0);
        }
        .right{
            background-color: rgb(255, 0, 43);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Header</h1>
        </header>
        <div class="navigativeMenu">
            <h1>Navigation Menu</h1>
        </div>
        <main>
            <div class="left">Left</div>
            <div class="center">Center</div>
            <div class="right">Right</div>
        </main>
        <footer>
            <h1>Footer</h1>
        </footer>
    </div>
</body>
</html>
