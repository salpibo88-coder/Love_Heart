<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            background-image: url('https://png.pngtree.com/background/20250108/original/pngtree-happy-birthday-background-for-blue-stereo-creative-picture-image_16090792.jpg');
            background-size: cover; background-position: center;
            font-family: 'Comic Sans MS', cursive; overflow: hidden;
        }

        /* ចលនាសម្រាប់រូបអំណោយ */
        #giftIcon { 
            width: 200px; cursor: pointer; 
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        #clickText {
            margin-top: 20px; padding: 15px 30px; font-size: 1.5rem;
            background: #ff4757; color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #clickText:hover { transform: scale(1.1); }

        #surprise-area { display: none; text-align: center; opacity: 0; transition: 1s; width: 100%; max-width: 600px; }
        
        .polaroid { 
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            padding: 20px; width: 90%; margin: 0 auto; border-radius: 20px;
        }
        .polaroid img { width: 100%; height: auto; border-radius: 20px; }
        .falling-item { position: absolute; top: -50px; font-size: 30px; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>

    <img id="giftIcon" src="sea.jpg" alt="Gift" onclick="triggerSurprise()">
    <button id="clickText" onclick="triggerSurprise()">Click It Now 👆</button>
    
    <div id="surprise-area">
        <h1 style="color: white;">Happy Birthday! 🎉</h1>
        <div class="polaroid">
            <img id="photo" src="https://png.pngtree.com/png-clipart/20240313/original/pngtree-happy-birthday-cake-transparent-background-png-image_14578946.png" alt="Birthday">
        </div>
    </div>

    <script>
        function createFallingItem() {
            const items = ['🎉', '🎈', '✨', '🎂', '🎁', '💖'];
            let item = document.createElement('div');
            item.className = 'falling-item';
            item.innerHTML = items[Math.floor(Math.random() * items.length)];
            item.style.left = Math.random() * 100 + 'vw';
            item.style.transition = (Math.random() * 3 + 3) + 's linear';
            document.body.appendChild(item);
            setTimeout(() => { item.style.transform = `translateY(110vh) rotate(360deg)`; }, 10);
            setTimeout(() => { item.remove(); }, 6000);
        }

        function triggerSurprise() {
            document.getElementById('giftIcon').style.display = 'none';
            document.getElementById('clickText').style.display = 'none';
            const area = document.getElementById('surprise-area');
            area.style.display = 'block';
            setTimeout(() => { area.style.opacity = '1'; }, 100);
            setInterval(createFallingItem, 300);
        }
    </script>
</body>
</html>
