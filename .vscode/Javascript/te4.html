<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
     let code = prompt("Enter Code:");
    let name = prompt("Enter Name:");
    let qty = parseInt(prompt("Enter quantity:"));
    let price = parseFloat(prompt("Enter Price $:"));
    let total = qty * price;
    let discountPercent = 0;
    if (price >= 60) {
        discountPercent = 0.70; 
    } else if (price >= 50) {
        discountPercent = 0.60; 
    } else if (price >= 40) {
        discountPercent = 0.50; 
    } else if (price >= 30) {
        discountPercent = 0.40; 
    } else if (price>= 20) {
        discountPercent = 0.30; 
    } else if (price>= 10) {
        discountPercent = 0.20; 
    } else if (price = 1) {
        discountPercent = 0.10; 
    }
    else {
        discountPercent = 0; 
    }
    let discountAmount = total * discountPercent;
    let payment = total - discountAmount;
    console.log("Product Receipt ");
    console.log("Code: " + code);
    console.log("Name: " + name);
    console.log("Quantity: " + qty);
    console.log("Price : $" + price.toFixed(2));
    console.log("Total: $" + total.toFixed(2));
    console.log("Discount Applied: " + (discountPercent * 100) + "%");
    console.log("Payment: $" + payment.toFixed(2));
    </script>
</body>
</html>
