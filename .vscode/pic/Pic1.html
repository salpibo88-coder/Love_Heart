<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('https://www.transparenttextures.com/patterns/graphy.png');
}

.card{
    width:400px;
    background:#eee;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.card img{
    width:100%;
}
.card img:hover{
    transition: 0.1em;
    color:blue;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
    filter:drop-shadow(0 0 10px rgba(0,0,0,0.5));
    transform:rotate(10deg);
}
.hot{
    background:rgb(175, 123, 123);
    color:white;
    display:inline-block;
    padding:10px 15px;
    border-radius:15px;
    font-weight:bold;
    margin-top:10px;
}

h2{
    margin-top:10px;
    font-size:20px;
    
}

.price{
    margin-top:10px;
    font-size:30px;
        color:rgb(111, 0, 255)
}

button{
    width:100%;
    margin-top:40px;
    padding:20px;
    border:none;
    border-radius:40px;
    background:yellow;
    
    color:white;
    font-size:25px;
    font-weight:bold;
    cursor:pointer;
    display:flex;
    justify-content:center;
    align-items:center;
}
button:hover{
    background:rgb(233, 5, 43);
    color:black;
    transition:0.3s;
}
</style>
</head>
<body>
<div class="card">
    <img src="https://pngimg.com/uploads/running_shoes/running_shoes_PNG5816.png">
    <div class="hot">HOT</div>
    <h2>Nike Air</h2>
    <div class="price">$120.00</div>
    <button>Shop Now</button>

</div>

</body>
</html>
