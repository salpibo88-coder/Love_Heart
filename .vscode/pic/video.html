<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Background</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial, sans-serif;
}

.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-1;
}

.overlay{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
}

.content{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:white;
    text-align:center;
    position:relative;
    z-index:1;
}

.content h1{
    font-size:60px;
    margin-bottom:10px;
}

.content p{
    font-size:24px;
}
</style>
</head>
<body>

<video class="video-bg" autoplay muted loop playsinline>
    <source src="https://cdn.pixabay.com/video/2016/04/19/2838-163487398_large.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<!-- Content -->
<div class="content">
    <h1>Welcome</h1>
    <p>Background Video Example</p>
</div>

</body>
</html>
