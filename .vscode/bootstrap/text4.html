<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doument</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <style>
        h2{
            /* background-color: rgb(255, 49, 49); */
            color:rgb(255, 255, 255)
            
            
        
        }
        /* .container{
            background-color: rgb(255, 255, 255);
            width: 800px;
            height: 700px;
        } */
    </style>
<div class="container mt-5">
    <div class=" bg-primary text-white p-4 rounded-3 d-flex items-center jusy">
        <h2 class="">Create Account</h2>
    </div>
    <form class="mt-4">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input type="text" class="form-control" placeholder="Enter first name">
            </div>
            <div class="col-md-6">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-control" placeholder="Enter last name">
            </div>
            <div class="col-md-6">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="kiko888@gmail.com">
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" placeholder="0886117007">
            </div>
            <div class="col-md-6">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Enter password">
            </div>
            <div class="col-md-6">
                <label class="form-label">Account Type</label>
                <select class="form-select">
                    <option selected>Choose one</option>
                    <option>TikTok</option>
                    <option>Telegram</option>
                    <option>Youtube</option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" placeholder="Street, City, Country">
            </div>
            <div class="col-md-6">
                <label class="form-label">City</label>
                <input type="text" class="form-control" placeholder="Phnom Penh">
            </div>
            <div class="col-md-6">
                <label class="form-label">Country</label>
                <select class="form-select">
                    <option selected>Cambodia</option>
                    <option>សៀម</option>
                    <option>យួន</option>
                </select>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agree">
                    <label class="form-check-label" for="agree">
                        I agree to the terms and privacy policy.
                    </label>
                </div>
            </div>
            <div class="col-12 d-flex gap-2   ">
                <button type="submit" class="btn    btn-info" style="color:rgb(0, 0, 0);font:bold">
                    Submit
                </button>
                <button type="reset" class="btn btn-danger">
                    Cancel
                </button>
            </div>

        </div>
    </form>
</div>
</body>
</html>
