<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Style Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f9f9f9; }
        .card { border: none; background: transparent; transition: transform 0.2s; }
        .card:hover { transform: scale(1.03); }
        .thumbnail { height: 200px; object-fit: cover; border-radius: 12px; }
        .video-title { font-weight: 600; font-size: 1rem; color: #0f0f0f; }
        .channel-name, .metadata { font-size: 0.9rem; color: #606060; }
        .search-btn { display: none; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><img src="https://cdn.pixabay.com/photo/2022/08/22/02/05/logo-7402513_640.png" width="40" alt="Logo"></a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item px-3"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item px-3"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item px-3"><a class="nav-link" href="#">Contact us</a></li>
                </ul>
                <form class="d-flex" role="search">
                    <input id="searchInput" class="form-control me-2" type="search" placeholder="Search" oninput="toggleSearchBtn()">
                    <button id="searchButton" class="btn btn-outline-success search-btn" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        <h4 class="mb-4">Recommended</h4>
        <div class="row g-4">
            <script>
                // ប្រើ loop ដើម្បីបង្កើតកាតចំនួន 40 (10 ជួរ * 4 កាត)
                for(let row=0; row<10; row++) {
                    for(let i=0; i<4; i++) {
                        let id = row * 4 + i + 1;
                        document.write(`
                        <div class="col-3">
                            <div class="card bg-transparent">
                                <img src="https://picsum.photos/400/225?random=${id}" class="thumbnail w-100" alt="Video">
                                <div class="card-body px-0">
                                    <div class="video-title mb-1 text-truncate">Amazing Video Title Number ${id}</div>
                                    <div class="channel-name">Channel Name</div>
                                    <div class="metadata">1.2M views • 2 hours ago</div>
                                </div>
                            </div>
                        </div>`);
                    }
                }
            </script>
        </div>
    </div>

    <script>
        function toggleSearchBtn() {
            const input = document.getElementById('searchInput');
            const btn = document.getElementById('searchButton');
            // ប៊ូតុងស្វែងរកលេចចេញលុះត្រាតែមានអត្ថបទ
            btn.style.display = input.value.length > 0 ? 'block' : 'none';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
