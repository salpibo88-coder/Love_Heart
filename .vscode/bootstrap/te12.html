<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Resource</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .food-img { width: 50px; height: 50px; object-fit: cover; }
    </style>
</head>
<body class="bg-light p-5">
    <div class="card shadow-sm p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0"></h4>
            <button class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#foodModal">+Add Pet</button>
        </div>
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>Age</th>
                    <th>Image</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>001</td>
                    <td>Cat1</td>
                    <td>male</td>
                    <td>1</td>
                    <td>
                        <img src="https://t3.ftcdn.net/jpg/01/35/30/04/360_F_135300481_5TSK8DX14n9iNUN8hsHqj8Cyhu01NRwI.jpg" alt="" class="rounded food-img">
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger">Delete</button> <button class="btn btn-sm btn-outline-warning">Edit</button>
                    </td>
                </tr>
                <tr>
                    <td>002</td>
                    <td>Cat2</td>
                    <td>female</td>
                    <td>2</td>
                    <td>
                        <img src="https://images.unsplash.com/photo-1637069810813-3aea5273dc7e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Y2F0JTIwd2hpdGUlMjBiYWNrZ3JvdW5kfGVufDB8fDB8fHww" alt="" class="rounded food-img">
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger">Delete</button> <button class="btn btn-sm btn-outline-warning">Edit</button>
                    </td>
                </tr>
                <tr>
                    <td>003</td>
                    <td>Cat3</td>
                    <td>male</td>
                    <td>3</td>
                    <td>
                        <img src="https://i.pinimg.com/736x/6a/1f/84/6a1f84d2ac0072e9370ca88add77a636.jpg" alt="" class="rounded food-img">
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger">Delete</button> <button class="btn btn-sm btn-outline-warning">Edit</button>
                    </td>
                </tr>
                <tr>
                    <td>004</td>
                    <td>Cat4</td>
                    <td>female</td>
                    <td>1</td>
                    <td>
                        <img src="https://media.istockphoto.com/id/1443562748/photo/cute-ginger-cat.jpg?s=612x612&w=0&k=20&c=vvM97wWz-hMj7DLzfpYRmY2VswTqcFEKkC437hxm3Cg=" alt="" class="rounded food-img">
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger">Delete</button> <button class="btn btn-sm btn-outline-warning">Edit</button>
                    </td>
                </tr>
                <tr>
                    <td>005</td>
                    <td>Cat5</td>
                    <td>male</td>
                    <td>4</td>
                    <td>
                        <img src="https://t4.ftcdn.net/jpg/02/23/55/67/360_F_223556761_6VamxuaG5aVcPJ1Kv9zjZw75tDtw9fy6.jpg" alt="" class="rounded food-img">
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger">Delete</button> <button class="btn btn-sm btn-outline-warning">Edit</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div class="modal fade" id="foodModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Food</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" placeholder="Name..."></div>
                        <div class="mb-3"><label class="form-label">Gender</label>
                            <select class="form-select" aria-placeholder="other">
                                <option disabled selected>---other---</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label">Age</label><input type="text" class="form-control" placeholder="Age..."></div>
                        <div class="mb-3"><label class="form-label">Image</label><input type="file" class="form-control"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
