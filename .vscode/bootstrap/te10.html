<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Carousel and Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="carousel slide carousel-dark mb-10" id="myCarousel" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="3000">
                <img src="https://t3.ftcdn.net/jpg/07/84/53/76/360_F_784537649_KN41ivtgjFTnOOKb78mmdLbND313hfbq.jpg" class="d-block w-100" height="400px" style="object-fit: cover;" alt="Slide 1">
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://as2.ftcdn.net/v2/jpg/07/61/00/15/1000_F_761001537_ukyXHCVIxfJ9dc1iqlsm5BGY3Q1teSma.jpg" class="d-block w-100" height="400px" style="object-fit: cover;" alt="Slide 2">
            </div>
            <div class="carousel-item" data-bs-interval="3000">
                <img src="https://t4.ftcdn.net/jpg/09/08/68/41/240_F_908684173_FEXaDfkJYeMqoq6UynARWKIM9cLdBixN.jpg" class="d-block w-100" height="400px" style="object-fit: cover;" alt="Slide 3">
            </div>
        </div>
        <button class="carousel-control-prev" data-bs-target="#myCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" data-bs-target="#myCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <div id="liveAlertPlaceholder"></div>
    <button type="button" class="btn btn-primary" id="liveAlertBtn">Show live alert</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const alertPlaceholder = document.getElementById('liveAlertPlaceholder');
    const appendAlert = (message, type) => {
        const wrapper = document.createElement('div');
        wrapper.innerHTML = [
            `<div class="alert alert-${type} alert-dismissible" role="alert">`,
            `   <div>${message}</div>`,
            '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
            '</div>'
        ].join('');
        alertPlaceholder.append(wrapper);
    };

    const alertTrigger = document.getElementById('liveAlertBtn');
    if (alertTrigger) {
        alertTrigger.addEventListener('click', () => {
            appendAlert('Nice, you triggered this alert message!', 'success');
        });
    }
</script>

</body>
</html>
