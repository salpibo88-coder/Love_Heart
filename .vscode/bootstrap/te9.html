<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILfVY47J16cr9ZwB07vP4J8+LH7qKNuqkuIAvNWLzen8TE5YBjuzZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEforCG1yvmw9Hj09Jcy3nv7wiPVlz7YYwJrWvCXk/BmnVdXM+D2scQbITXi" crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="carousel slide carousel-dark" id="data" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="1000">
          <img src="https://i.pinimg.com/736x/ee/47/3d/ee473da3e3a1e6880f8c438178a3bc1a.jpg" class="d-block w-100" height="500px" alt="">
        </div>
        <div class="carousel-item " data-bs-interval="1000">
          <img src="https://i.pinimg.com/1200x/c5/58/dd/c558ddd976db8c9b905505abdbbf028e.jpg" class="d-block w-100" height="500px" alt="">
        </div>
        <div class="carousel-item " data-bs-interval="1000">
          <img src="https://i.pinimg.com/736x/77/2d/9a/772d9acc3cbce6f320a323cdaca6db91.jpg" class="d-block w-100" height="500px" alt="">
        </div>
      </div>
      <button class="carousel-control-prev" data-bs-target="#data" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
        <span class="visually-hidden">prev</span>
      </button>
      <button class="carousel-control-next" data-bs-target="#data" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
        <span class="visually-hidden">next</span>
      </button>
    </div>
  </body>
</html>
