    <button onclick="alertt()">alert</button>

<script>
    // const txt=document.querySelector('#txt').innerHTML='<h1>hello</h1>'

        txt.style.color='red'

    }
    const alertt=()=>{
        alert("welcome")
    }
</script>
</body>
</html>
